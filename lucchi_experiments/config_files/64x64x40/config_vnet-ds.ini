[main]
output_dir = './outputs/train-0.75_valid-0.25/vnet-ds_f24/64x64x40'
is_train = True
is_test = True
is_statistics = True
visible_devices = '0'  # Which GPU is used

[input_lists]
data_dir = './data/tiles/64x64x40/'  # Where the images are stored
# Folder that contains the image lists
list_dir = './data/splits'
data_lists_train_paths = [
	${list_dir}'/img_train-0.75.txt',
	${list_dir}'/seg_train-0.75.txt',
	]
data_lists_valid_paths = [
	${list_dir}'/img_valid-0.25.txt',
	${list_dir}'/seg_valid-0.25.txt',
	]
data_lists_test_paths = [
	${list_dir}'/img_test-1.0.txt',
	${list_dir}'/seg_test-1.0.txt',
	]

[input_args]
idx_x_modalities = [0]  # Indexes to x modalities in the data lists
idx_y_modalities = [1]  # Indexes to y modalities in the data lists
batch_size = 1
num_workers = 4  # Must be >= 1 to use multiprocessing
use_data_normalization = True

[augmentation]
rotation_range = [30, 0, 0]  # Along the depth, height, width axis
shift_range = [0.2, 0.2, 0.2]
zoom_range = [0.8, 1.2]
augmentation_probability = 0.8

[model]
model_name = 'VNetDS'
out_channels = 2
base_num_filters = 24
num_blocks = [1, 2, 3, 3, 3]
right_leg_indexes = [0, 1, 2, 3, 4]

[optimizer]
optimizer_name = 'Adamax'
lr = 5e-3

[scheduler]
scheduler_name = 'CosineAnnealingWarmRestarts'
eta_min = 1e-3

[loss]
loss_name = 'PCCLoss'

[train]
num_epochs = 300
selection_epoch_portion = 0.5
is_plot_model = True  # If you cannot install graphviz, change it to False
is_print = True

[test]
output_folder = 'test'  # A subfolder under `output_dir`

[statistics]
use_surface_dice = False
use_hd95 = False
region_names = ['background', 'mitochondria']
region_labels = [
	[0],
	[1],
	]
