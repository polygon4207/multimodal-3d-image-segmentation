[io]
input_dir = './data/lucchi/'
output_dir = './data/tiles/128x128x80/'

[tiling]
tile_size = [160, 256, 256]  # Tile size (d, h, w).
scale_factor = 2  # Downsampling factor: tiles of 128x128x80 (W x H x D).
modalities = ['img', 'seg']  # List of str of modalities.
ext = 'nii.gz'  # Image file extension, e.g. nii.gz
