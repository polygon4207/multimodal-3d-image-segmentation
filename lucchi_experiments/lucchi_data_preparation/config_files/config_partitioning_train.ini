[io]
output_dir = './data/splits'  # Where to save the output files

[partitioning]
base_paths = [  # List of str, each is a full path that contains required data.
	'./data/tiles/train/',
	]
train_fraction = 0.75  # Fraction for training in [0, 1].
valid_fraction = 0.25  # Fraction for validation in [0, 1].
test_fraction = 0.0  # Fraction for testing in [0, 1].
modalities = ['img', 'seg']  # List of str of modalities.
ext = 'nii.gz'  # Image file extension, e.g. nii.gz
remove_str = './data/tiles/'  # String to be removed.
seed = 100  # For the random number generator to produce the same randomization, if not None.
